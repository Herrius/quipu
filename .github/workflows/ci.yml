name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Typecheck + Clippy + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema (webkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias JS
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        run: bunx tsc --noEmit

      - name: Build frontend
        run: bun run build

      - name: Clippy (warnings = error)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  security:
    name: Seguridad (SAST + deps + secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secretos en el historial)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep scan --config p/default --config p/typescript --error

      - name: cargo-audit (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - uses: oven-sh/setup-bun@v2
      - name: Auditoría de dependencias JS
        run: |
          bun install --frozen-lockfile
          bun audit
