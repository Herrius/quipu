[package]
name = "quipu"
version = "0.1.2"
description = "Quipu — biblioteca y lector personal de PDF/EPUB"
authors = ["Enrique Ubaldo"]
edition = "2021"

[lib]
name = "quipu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
